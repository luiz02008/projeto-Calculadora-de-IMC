<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de IMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #13131c;
      --border: #1e1e2e;
      --accent: #c8f550;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --danger: #f55060;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,245,80,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,245,80,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header { margin-bottom: 32px; }

    .header .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(200,245,80,0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 12vw, 72px);
      line-height: 0.9;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 400;
      color: #ffffff !important;
      line-height: 1.5;
      background: rgba(255,255,255,0.08) !important;
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      border-radius: 6px;
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 50px 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,245,80,0.1);
    }

    .input-wrap input::placeholder { color: var(--muted); }

    .input-wrap .unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--muted);
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .hint {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-calcular {
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.08em;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-calcular:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,245,80,0.25);
    }

    .btn-calcular:active { transform: translateY(0); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      font-size: 18px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-reset:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .result {
      margin-top: 24px;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: none;
    }

    .result.show {
      display: block;
      animation: fadeUp 0.4s ease both;
    }

    .result-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    .imc-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      line-height: 1;
    }

    .imc-label {
      font-size: 13px;
      color: var(--muted);
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid;
      margin-bottom: 16px;
    }

    .category-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .imc-bar {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, #50f5c0 0%, #c8f550 35%, #f5a550 65%, #f55060 100%);
      position: relative;
      margin-bottom: 8px;
    }

    .imc-needle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: var(--text);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text);
      transition: left 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .person-info {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.8;
    }

    .person-info strong { color: var(--text); font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="header">
      <div class="tag">Saude &amp; Bem-estar</div>
      <h1>CALCULADORA<br><span>DE IMC</span></h1>
      <p>Indice de Massa Corporal<br>Calcule e descubra sua faixa de saude.</p>
    </div>

    <div class="card">

      <div class="field">
        <label>Nome completo</label>
        <div class="input-wrap">
          <input type="text" id="nome" placeholder="Digite seu nome" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Peso</label>
          <div class="input-wrap">
            <input type="number" id="peso" placeholder="Digite seu peso" min="1" />
            <span class="unit">kg</span>
          </div>
        </div>
        <div class="field">
          <label>Altura</label>
          <div class="input-wrap">
            <input type="number" id="altura" placeholder="Digite sua altura" step="0.01" min="0.5" max="2.5" />
            <span class="unit">m</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Idade</label>
        <div class="input-wrap">
          <input type="number" id="idade" placeholder="Digite sua idade" min="1" max="120" />
          <span class="unit">anos</span>
        </div>
      </div>

      <p class="hint" id="hint">Preencha todos os campos para calcular</p>

      <div class="btn-row">
        <button class="btn-calcular" onclick="calcular()">CALCULAR IMC</button>
        <button class="btn-reset" onclick="resetar()">X</button>
      </div>

      <div class="result" id="result">
        <div class="result-header">
          <div class="imc-value" id="imcValor">-</div>
          <div class="imc-label">IMC</div>
        </div>

        <div class="category-badge" id="categoriaBadge">
          <span class="dot" id="categoriaDot"></span>
          <span id="categoriaTexto">-</span>
        </div>

        <div class="imc-bar">
          <div class="imc-needle" id="needle" style="left: 0%"></div>
        </div>
        <div class="bar-labels">
          <span>Abaixo</span>
          <span>Normal</span>
          <span>Sobrepeso</span>
          <span>Obeso</span>
        </div>

        <div class="person-info" id="personInfo"></div>
      </div>

    </div>
  </div>

  <script>
    var campos = ['nome', 'peso', 'altura', 'idade'];

    function verificarCampos() {
      var peso   = document.getElementById('peso').value;
      var altura = document.getElementById('altura').value;
      var idade  = document.getElementById('idade').value;
      var hint   = document.getElementById('hint');

      if (peso && altura && idade) {
        hint.style.display = 'none';
      } else {
        hint.style.display = 'block';
        hint.textContent = 'Preencha todos os campos para calcular';
      }
    }

    campos.forEach(function(id) {
      document.getElementById(id).addEventListener('input', verificarCampos);
    });

    function resetar() {
      document.getElementById('nome').value = '';
      document.getElementById('peso').value = '';
      document.getElementById('altura').value = '';
      document.getElementById('idade').value = '';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('hint').textContent = 'Preencha todos os campos para calcular';
      document.getElementById('result').classList.remove('show');
    }

    function calcular() {
      var nome   = document.getElementById('nome').value.trim();
      var peso   = parseFloat(document.getElementById('peso').value);
      var altura = parseFloat(document.getElementById('altura').value);
      var idade  = parseInt(document.getElementById('idade').value);
      var anoNascimento = idade ? (2026 - idade) : null;

      if (!peso || !altura || altura <= 0) {
        alert('Por favor, preencha peso e altura corretamente.');
        return;
      }

      var imc = peso / (altura * altura);

      var categoria, cor, bgCor, pct;

      if (imc < 18.5) {
        categoria = 'Abaixo do peso';
        cor       = '#50f5c0';
        bgCor     = 'rgba(80,245,192,0.1)';
        pct       = Math.min((imc / 18.5) * 20, 20);
      } else if (imc < 25) {
        categoria = 'Peso normal';
        cor       = '#c8f550';
        bgCor     = 'rgba(200,245,80,0.1)';
        pct       = 20 + ((imc - 18.5) / 6.5) * 30;
      } else if (imc < 30) {
        categoria = 'Sobrepeso';
        cor       = '#f5a550';
        bgCor     = 'rgba(245,165,80,0.1)';
        pct       = 50 + ((imc - 25) / 5) * 25;
      } else {
        categoria = 'Obesidade';
        cor       = '#f55060';
        bgCor     = 'rgba(245,80,96,0.1)';
        pct       = Math.min(75 + ((imc - 30) / 10) * 25, 97);
      }

      document.getElementById('imcValor').textContent = imc.toFixed(2);
      document.getElementById('imcValor').style.color = cor;

      var badge = document.getElementById('categoriaBadge');
      badge.style.color       = cor;
      badge.style.borderColor = cor;
      badge.style.background  = bgCor;
      document.getElementById('categoriaDot').style.background = cor;
      document.getElementById('categoriaTexto').textContent    = categoria;

      setTimeout(function() {
        document.getElementById('needle').style.left = pct + '%';
      }, 100);

      var info = '';
      if (nome) info += '<strong>' + nome + '</strong> &mdash; ';
      if (idade) info += idade + ' anos &nbsp;|&nbsp; ';
      info += peso + ' kg &nbsp;|&nbsp; ' + altura + ' m';
      if (anoNascimento) info += ' &nbsp;|&nbsp; Nascido em ' + anoNascimento;
      document.getElementById('personInfo').innerHTML = info;

      var r = document.getElementById('result');
      r.classList.remove('show');
      void r.offsetWidth;
      r.classList.add('show');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calcular();
    });
  </script>
</body>
</html>
