name: Docker Build and Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub (opcional - apenas para push)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Se não for usar Docker Hub, pode ignorar este passo

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            imc-calculator:latest
            imc-calculator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image metadata
        if: github.event_name != 'pull_request'
        run: |
          echo "✓ Imagem construída com sucesso!"
          echo "Tags: imc-calculator:latest, imc-calculator:${{ github.sha }}"
          echo ""
          echo "Para executar:"
          echo "  docker run -d -p 8080:80 imc-calculator:latest"
          echo ""
          echo "Acesso: http://localhost:8080"
