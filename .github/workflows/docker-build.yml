name: Docker Build and Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo_lowercase
        run: |
          echo "repository_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repository_lowercase }}:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repository_lowercase }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image metadata
        if: github.event_name != 'pull_request'
        run: |
          echo "✓ Imagem construída e enviada com sucesso!"
          echo "Tags: ghcr.io/${{ steps.repo_lowercase.outputs.repository_lowercase }}:latest"
          echo ""
          echo "Para executar:"
          echo "  docker pull ghcr.io/${{ steps.repo_lowercase.outputs.repository_lowercase }}:latest"
          echo "  docker run -d -p 8080:80 ghcr.io/${{ steps.repo_lowercase.outputs.repository_lowercase }}:latest"
          echo ""
          echo "Acesso: http://localhost:8080"
